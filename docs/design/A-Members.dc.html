<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Members</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#B4532A}a:hover{color:#8E3F1F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F1E8; color: #2B211A; font-family: Inter, system-ui, sans-serif">
  <div style="padding: 14px 20px 100px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFCF7; border: 1px solid #E6DACB; color: #2B211A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></a>
      <div style="display: flex; flex-direction: column"><h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700">Members</h1><span style="font-size: 13px; color: #6E5F52">9 people in Cumetria</span></div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #F4E4D8; color: #6A2E14; font-size: 14px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M4 14h16M12 10v10M12 10c-2-3-5-4-5-1.5S10 10 12 10c2 0 5 .9 5-1.5S14 7 12 10z"/></svg>
      <span><strong>Ana</strong> turns 27 in 9 days, on Saturday 28 Nov</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFCF7; border: 1px solid #E6DACB; border-radius: 18px; display: flex; flex-direction: column">
      <sc-for list="{{ people }}" as="p" hint-placeholder-count="9">
        <li style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid {{ p.divider }}">
          <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; background: {{ p.bg }}; color: {{ p.fg }}">{{ p.initial }}</span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">{{ p.name }}</span><span style="font-size: 13px; color: #6E5F52">{{ p.line }}</span></div>
          <sc-if value="{{ p.admin }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 600; color: #8E3F1F; background: #F4E4D8; padding: 3px 8px; border-radius: 8px">Admin</span></sc-if>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A89884" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </li>
      </sc-for>
    </ul>
  </div>
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFCF7; border-top: 1px solid #E6DACB; display: flex; align-items: center; justify-content: space-around; padding: 0 8px 8px; box-sizing: border-box">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; padding: 6px 0; color: #6E5F52; text-decoration: none; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; padding: 6px 0; color: #6E5F52; text-decoration: none; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
    <button aria-label="Propose an event" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #B4532A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -26px; box-shadow: 0 6px 16px rgba(180,83,42,0.35)"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; padding: 6px 0; color: #6E5F52; text-decoration: none; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Explore</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; padding: 6px 0; color: #B4532A; text-decoration: none; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = [['#F4D9C6', '#6A2E14'], ['#E7E3C8', '#3D4220'], ['#D8E3EC', '#1F3A52'], ['#E6DCEF', '#3E2A5C'], ['#E3ECD9', '#2F4D21']];
    const list = [
      ['Alex', 'Birthday 3 March · 3 upcoming', true],
      ['Ana', 'Birthday 28 November · 2 upcoming', false],
      ['Bianca', 'Birthday 14 July · 1 upcoming', false],
      ['Dana', 'Birthday 9 January · 2 upcoming', false],
      ['Ioana', 'Birthday 22 May · 3 upcoming', false],
      ['Mihai', 'Birthday 30 August · 2 upcoming', false],
      ['Radu', 'Birthday 17 October · 1 upcoming', false],
      ['Sorin', 'Birthday 5 February · 1 upcoming', false],
      ['Tudor', 'Birthday 11 December · no plans yet', false]
    ];
    const people = list.map(([name, line, admin], i) => ({
      name, line, admin, initial: name.charAt(0),
      bg: tones[i % tones.length][0], fg: tones[i % tones.length][1],
      divider: i === list.length - 1 ? 'transparent' : '#EFE5D8'
    }));
    return { people };
  }
}
</script>
</body>
</html>
