<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunday Picnic: event preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#B4532A}a:hover{color:#8E3F1F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F1E8; color: #2B211A; font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="height: 44px; width: 140px; border-radius: 12px; background: #EBE1D3"></div>
    <div style="height: 180px; border-radius: 22px; background: #B4532A"></div>
    <div style="height: 90px; border-radius: 18px; background: #FFFCF7"></div>
    <div style="height: 200px; border-radius: 18px; background: #FFFCF7"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(43,33,26,0.45)"></div>
  <section aria-label="Event preview" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFCF7; border-radius: 26px 26px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -8px 30px rgba(43,33,26,0.18)">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9CBB8"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="align-self: flex-start; font-size: 12px; font-weight: 600; color: #2F4D21; background: #E3ECD9; padding: 4px 10px; border-radius: 12px">Outdoors · Bucharest</span>
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700; line-height: 1.15">Walk and mulled wine</h2>
      </div>
      <button aria-label="Close preview" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #E6DACB; background: #F7F1E8; color: #2B211A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px">
      <div style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E5F52" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Saturday, 21 November · 16:00–19:00</div>
      <div style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E5F52" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span style="flex: 1">Parcul Herăstrău, main entrance</span><a href="#" style="font-weight: 600">Map</a></div>
      <div style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E5F52" stroke-width="1.8" stroke-linecap="round"><path d="M7 18a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 8.5 4.5 4.5 0 0 1 17 18z"/></svg>Forecast: 6°, cloudy · Proposed by Ioana</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #F7F1E8">
      <div style="display: flex">
        <span style="width: 30px; height: 30px; border-radius: 15px; background: #F4D9C6; color: #6A2E14; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #F7F1E8">I</span>
        <span style="width: 30px; height: 30px; border-radius: 15px; background: #E7E3C8; color: #3D4220; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #F7F1E8; margin-left: -8px">M</span>
        <span style="width: 30px; height: 30px; border-radius: 15px; background: #D8E3EC; color: #1F3A52; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #F7F1E8; margin-left: -8px">D</span>
        <span style="width: 30px; height: 30px; border-radius: 15px; background: #E6DCEF; color: #3E2A5C; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #F7F1E8; margin-left: -8px">+4</span>
      </div>
      <span style="font-size: 13px; color: #4A3D32">8 going · 1 maybe · 4 spots left</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 600; color: #6E5F52">Are you coming?</span>
      <div role="group" aria-label="Your answer" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button onClick="{{ setGoing }}" style="height: 48px; border-radius: 14px; font-size: 15px; font-weight: 600; background: {{ going.bg }}; color: {{ going.fg }}; border: 1.5px solid {{ going.bd }}">Going</button>
        <button onClick="{{ setMaybe }}" style="height: 48px; border-radius: 14px; font-size: 15px; font-weight: 600; background: {{ maybe.bg }}; color: {{ maybe.fg }}; border: 1.5px solid {{ maybe.bd }}">Maybe</button>
        <button onClick="{{ setNo }}" style="height: 48px; border-radius: 14px; font-size: 15px; font-weight: 600; background: {{ no.bg }}; color: {{ no.fg }}; border: 1.5px solid {{ no.bd }}">No</button>
      </div>
      <sc-if value="{{ showReasons }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
          <span style="font-size: 13px; color: #6E5F52">Quick reason</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{ reasons }}" as="item" hint-placeholder-count="4">
              <button onClick="{{ item.pick }}" style="height: 40px; padding: 0 14px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1px solid #D9CBB8; background: {{ item.bg }}; color: {{ item.fg }}">{{ item.label }}</button>
            </sc-for>
          </div>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #6E5F52">Note (optional)
            <input type="text" placeholder="e.g. I'll know by Friday" style="height: 42px; border-radius: 12px; border: 1px solid #D9CBB8; background: #FFFFFF; padding: 0 12px; font: inherit; font-size: 14px; color: #2B211A">
          </label>
        </div>
      </sc-if>
    </div>
    <div style="display: flex; gap: 10px">
      <button style="height: 50px; padding: 0 16px; border-radius: 16px; border: 1px solid #D9CBB8; background: #FFFCF7; color: #2B211A; font-size: 14px; font-weight: 600">+ Guest</button>
      <a href="#" style="flex: 1; height: 50px; border-radius: 16px; background: #2B211A; color: #FFFCF7; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">Open event<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (this.state && this.state.rsvp) || 'maybe';
    const reason = (this.state && this.state.reason) || 'Working';
    const btn = (k) => r === k
      ? { bg: '#B4532A', fg: '#FFFFFF', bd: '#B4532A' }
      : { bg: '#FFFCF7', fg: '#2B211A', bd: '#D9CBB8' };
    return {
      going: btn('going'), maybe: btn('maybe'), no: btn('no'),
      setGoing: () => this.setState({ rsvp: 'going' }),
      setMaybe: () => this.setState({ rsvp: 'maybe' }),
      setNo: () => this.setState({ rsvp: 'no' }),
      showReasons: r !== 'going',
      reasons: ['Working', 'Out of town', 'Not feeling it', 'Other'].map((x) => ({
        label: x,
        bg: reason === x ? '#2B211A' : '#FFFCF7',
        fg: reason === x ? '#FFFCF7' : '#2B211A',
        pick: () => this.setState({ reason: x })
      }))
    };
  }
}
</script>
</body>
</html>
