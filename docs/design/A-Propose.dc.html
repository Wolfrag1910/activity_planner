<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Propose an event</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#B4532A}a:hover{color:#8E3F1F}
</style>
</helmet>
<div style="width: 390px; height: 1320px; position: relative; background: #F7F1E8; color: #2B211A; font-family: Inter, system-ui, sans-serif">
  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px">
    <button aria-label="Close without saving" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E6DACB; background: #FFFCF7; color: #2B211A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 700">Propose an event</h1>
  </div>
  <form style="padding: 6px 20px 120px; display: flex; flex-direction: column; gap: 22px">
    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="font-size: 14px; font-weight: 600; padding: 0 0 10px">Category</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 48px; border-radius: 14px; border: 2px solid #2F4D21; background: #E3ECD9; color: #2F4D21; font-size: 14px; font-weight: 600">Outdoors</button>
        <button type="button" style="height: 48px; border-radius: 14px; border: 1px solid #E6DACB; background: #FFFCF7; color: #2B211A; font-size: 14px; font-weight: 500">Trips</button>
        <button type="button" style="height: 48px; border-radius: 14px; border: 1px solid #E6DACB; background: #FFFCF7; color: #2B211A; font-size: 14px; font-weight: 500">Vacations</button>
        <button type="button" style="height: 48px; border-radius: 14px; border: 1px solid #E6DACB; background: #FFFCF7; color: #2B211A; font-size: 14px; font-weight: 500">Gaming</button>
      </div>
    </fieldset>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Title
      <input type="text" value="Walk and mulled wine" style="height: 50px; border-radius: 14px; border: 1px solid #D9CBB8; background: #FFFCF7; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 400; color: #2B211A">
    </label>
    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 600; padding: 0 0 10px">How should it start?</legend>
      <button type="button" style="text-align: left; padding: 14px 16px; border-radius: 16px; border: 2px solid #B4532A; background: #FFFCF7; color: #2B211A; display: flex; gap: 12px; align-items: flex-start">
        <span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 10px; border: 6px solid #B4532A; box-sizing: border-box; margin-top: 2px"></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Publish it now</span><span style="font-size: 13px; color: #6E5F52">It's an official event. People answer Going, Maybe or No.</span></span>
      </button>
      <button type="button" style="text-align: left; padding: 14px 16px; border-radius: 16px; border: 1px solid #E6DACB; background: #FFFCF7; color: #2B211A; display: flex; gap: 12px; align-items: flex-start">
        <span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 10px; border: 2px solid #A89884; box-sizing: border-box; margin-top: 2px"></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Open it to a vote first</span><span style="font-size: 13px; color: #6E5F52">People vote their interest. You confirm when enough are in.</span></span>
        <span style="font-size: 11px; font-weight: 600; color: #6E5F52; border: 1px solid #D9CBB8; padding: 2px 7px; border-radius: 8px">v2</span>
      </button>
    </fieldset>
    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="font-size: 14px; font-weight: 600; padding: 0 0 10px">When</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #6E5F52">Starts
          <input type="text" value="Sat, 21 Nov" style="height: 48px; border-radius: 14px; border: 1px solid #D9CBB8; background: #FFFCF7; padding: 0 12px; font: inherit; font-size: 15px; color: #2B211A">
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #6E5F52">At
          <input type="text" value="16:00" style="height: 48px; border-radius: 14px; border: 1px solid #D9CBB8; background: #FFFCF7; padding: 0 12px; font: inherit; font-size: 15px; color: #2B211A">
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #6E5F52">Ends
          <input type="text" value="Sat, 21 Nov" style="height: 48px; border-radius: 14px; border: 1px solid #D9CBB8; background: #FFFCF7; padding: 0 12px; font: inherit; font-size: 15px; color: #2B211A">
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #6E5F52">At
          <input type="text" value="19:00" style="height: 48px; border-radius: 14px; border: 1px solid #D9CBB8; background: #FFFCF7; padding: 0 12px; font: inherit; font-size: 15px; color: #2B211A">
        </label>
      </div>
      <span style="font-size: 13px; color: #6E5F52">For trips and vacations, pick a later end date.</span>
    </fieldset>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Where
        <input type="text" value="Parcul Herăstrău, main entrance" style="height: 50px; border-radius: 14px; border: 1px solid #D9CBB8; background: #FFFCF7; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 400; color: #2B211A">
      </label>
      <button type="button" style="align-self: flex-start; height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid #D9CBB8; background: #FFFCF7; color: #2B211A; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Pick on the map</button>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Details <span style="font-weight: 400; color: #6E5F52; font-size: 13px">What to bring, how to get there, anything people should know</span>
      <textarea rows="3" style="border-radius: 14px; border: 1px solid #D9CBB8; background: #FFFCF7; padding: 12px 14px; font: inherit; font-size: 15px; font-weight: 400; color: #2B211A; resize: none">A slow walk around the lake, then mulled wine at the stalls near the entrance. Bring gloves.</textarea>
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 600">Spots</span>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 50px; border-radius: 14px; border: 1px solid #D9CBB8; background: #FFFCF7; padding: 0 4px">
          <button type="button" aria-label="Fewer spots" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #F7F1E8; color: #2B211A; font-size: 20px">−</button>
          <span style="font-size: 16px; font-weight: 600">12</span>
          <button type="button" aria-label="More spots" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #F7F1E8; color: #2B211A; font-size: 20px">+</button>
        </div>
        <span style="font-size: 12px; color: #6E5F52">Guests count too. Leave empty for no limit.</span>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Answer by
        <input type="text" value="Fri, 20 Nov · 20:00" style="height: 50px; border-radius: 14px; border: 1px solid #D9CBB8; background: #FFFCF7; padding: 0 12px; font: inherit; font-size: 14px; font-weight: 400; color: #2B211A">
        <span style="font-size: 12px; font-weight: 400; color: #6E5F52">Optional</span>
      </label>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <button type="button" style="height: 52px; border-radius: 16px; border: 1.5px dashed #C9B8A2; background: transparent; color: #2B211A; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">+ Add a poll <span style="font-size: 11px; font-weight: 600; color: #6E5F52; border: 1px solid #D9CBB8; padding: 2px 7px; border-radius: 8px">v2</span></button>
      <button type="button" style="height: 52px; border-radius: 16px; border: 1.5px dashed #C9B8A2; background: transparent; color: #2B211A; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">+ Add a cost <span style="font-size: 11px; font-weight: 600; color: #6E5F52; border: 1px solid #D9CBB8; padding: 2px 7px; border-radius: 8px">v3</span></button>
    </div>
  </form>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 22px; background: #FFFCF7; border-top: 1px solid #E6DACB">
    <button style="width: 100%; height: 54px; border-radius: 16px; border: none; background: #B4532A; color: #FFFFFF; font-size: 16px; font-weight: 600">Publish event</button>
  </div>
</div>
</x-dc>

</html>
