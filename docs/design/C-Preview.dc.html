<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Postcard: event preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#A8331F}a:hover{color:#7E2414}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBEFD9; color: #2A1E14; font-family: 'DM Sans', system-ui, sans-serif">
  <div aria-hidden="true" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="height: 44px; width: 150px; border-radius: 12px; background: #F1E0C2"></div>
    <div style="height: 150px; border-radius: 18px; background: #C8402A"></div>
    <div style="height: 44px; border-radius: 22px; background: #F1E0C2"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(42,30,20,0.5)"></div>
  <section aria-label="Event preview" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFF8EC; border-top: 2px solid #2A1E14; border-radius: 24px 24px 0 0; overflow: hidden; display: flex; flex-direction: column">
    <div style="background: #CFE3B8; border-bottom: 2px solid #2A1E14; padding: 10px 20px 18px; display: flex; flex-direction: column; gap: 10px">
      <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #2A1E14; opacity: 0.35"></div>
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 700; color: #2D4E1C; letter-spacing: 1px">OUTDOORS · BUCHAREST</span>
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 800; line-height: 1.02">Walk and mulled wine</h2>
        </div>
        <button aria-label="Close preview" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; border: 2px solid #2A1E14; background: #FFF8EC; color: #2A1E14; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </div>
    <div style="padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px; font-size: 15px">
        <div style="display: flex; justify-content: space-between"><span style="color: #6B5A48">When</span><span style="font-weight: 700">Sat 21 Nov · 16:00–19:00</span></div>
        <div style="display: flex; justify-content: space-between"><span style="color: #6B5A48">Where</span><span style="font-weight: 700">Parcul Herăstrău · <a href="#">Map</a></span></div>
        <div style="display: flex; justify-content: space-between"><span style="color: #6B5A48">Weather</span><span style="font-weight: 700">6°, cloudy</span></div>
        <div style="display: flex; justify-content: space-between"><span style="color: #6B5A48">Who</span><span style="font-weight: 700">8 going · 4 spots left</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 18px; font-weight: 800">You in?</span>
        <div role="group" aria-label="Your answer" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <button onClick="{{ setGoing }}" style="height: 50px; border-radius: 12px; border: 2px solid #2A1E14; font-size: 15px; font-weight: 700; background: {{ going.bg }}; color: {{ going.fg }}; box-shadow: {{ going.sh }}">Going</button>
          <button onClick="{{ setMaybe }}" style="height: 50px; border-radius: 12px; border: 2px solid #2A1E14; font-size: 15px; font-weight: 700; background: {{ maybe.bg }}; color: {{ maybe.fg }}; box-shadow: {{ maybe.sh }}">Maybe</button>
          <button onClick="{{ setNo }}" style="height: 50px; border-radius: 12px; border: 2px solid #2A1E14; font-size: 15px; font-weight: 700; background: {{ no.bg }}; color: {{ no.fg }}; box-shadow: {{ no.sh }}">No</button>
        </div>
        <sc-if value="{{ showReasons }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{ reasons }}" as="item" hint-placeholder-count="4">
                <button onClick="{{ item.pick }}" style="height: 40px; padding: 0 14px; border-radius: 20px; font-size: 13px; font-weight: 700; border: 2px solid #2A1E14; background: {{ item.bg }}; color: {{ item.fg }}">{{ item.label }}</button>
              </sc-for>
            </div>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #6B5A48">Note (optional)
              <input type="text" placeholder="e.g. I'll know by Friday" style="height: 42px; border-radius: 10px; border: 2px solid #2A1E14; background: #FFFFFF; padding: 0 12px; font: inherit; font-size: 14px; color: #2A1E14">
            </label>
          </div>
        </sc-if>
      </div>
      <div style="display: flex; gap: 10px">
        <button style="height: 52px; padding: 0 16px; border-radius: 12px; border: 2px solid #2A1E14; background: #FFF8EC; color: #2A1E14; font-size: 14px; font-weight: 700">+ Guest</button>
        <a href="#" style="flex: 1; height: 52px; border-radius: 12px; border: 2px solid #2A1E14; background: #2A1E14; color: #FFF8EC; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">Open event<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (this.state && this.state.rsvp) || 'maybe';
    const reason = (this.state && this.state.reason) || 'Working';
    const btn = (k) => r === k
      ? { bg: '#C8402A', fg: '#FFFFFF', sh: '3px 3px 0 #2A1E14' }
      : { bg: '#FFF8EC', fg: '#2A1E14', sh: 'none' };
    return {
      going: btn('going'), maybe: btn('maybe'), no: btn('no'),
      setGoing: () => this.setState({ rsvp: 'going' }),
      setMaybe: () => this.setState({ rsvp: 'maybe' }),
      setNo: () => this.setState({ rsvp: 'no' }),
      showReasons: r !== 'going',
      reasons: ['Working', 'Out of town', 'Not feeling it', 'Other'].map((x) => ({
        label: x,
        bg: reason === x ? '#F6CFA8' : '#FFF8EC',
        fg: '#2A1E14',
        pick: () => this.setState({ reason: x })
      }))
    };
  }
}
</script>
</body>
</html>
