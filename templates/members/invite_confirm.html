{% extends "base_public.html" %}
{% load i18n %}

{% block content %}
  <div class="message-page">
    <h1>{% blocktranslate with name=invite.name %}Welcome, {{ name }}{% endblocktranslate %}</h1>
    <p>{% blocktranslate %}You'll join Cumetria with <strong>{{ email }}</strong>.{% endblocktranslate %}</p>
    <form method="post">
      {% csrf_token %}
      <button class="button button-primary button-block button-tall" type="submit">{% translate "Join Cumetria" %}</button>
    </form>
  </div>
{% endblock %}
